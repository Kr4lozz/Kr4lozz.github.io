<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos Creados - Authorization</title>
<style>
body{font-family:system-ui,sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;color:#222}
</style>
</head>
<body>
<h1>Videos Creados</h1>
<p id="msg">Finishing your TikTok login…</p>
<p><a href="/app.html">Back to the app</a></p>
<script>
var p = new URLSearchParams(location.search);
var msg = document.getElementById('msg');
if (p.get('error')) {
  msg.textContent = 'Authorization was cancelled or failed: ' + (p.get('error_description') || p.get('error'));
} else if (p.get('code') && p.get('state')) {
  fetch('http://localhost:8787/api/exchange', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: p.get('code'), state: p.get('state') })
  }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); }); })
    .then(function () { msg.textContent = 'Connected. Redirecting…'; location.replace('/app.html'); })
    .catch(function (e) { msg.textContent = 'Could not finish the login: ' + e.message + '. Make sure the local server is running (node app/server.js) and try again.'; });
} else {
  msg.textContent = 'This page receives the login response from TikTok.';
}
</script>
</body>
</html>
