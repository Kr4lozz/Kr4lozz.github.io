<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos Creados - Autorización</title>
<style>
body{font-family:system-ui,sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;color:#222}
code{background:#f2f2f2;padding:.1rem .3rem;border-radius:4px;word-break:break-all}
</style>
</head>
<body>
<h1>Videos Creados</h1>
<p id="msg">Procesando autorización de TikTok…</p>
<p id="detail"></p>
<p><a href="/">Volver al inicio</a></p>
<script>
var p = new URLSearchParams(location.search);
var msg = document.getElementById('msg');
var detail = document.getElementById('detail');
if (p.get('error')) {
  msg.textContent = 'La autorización fue cancelada o falló.';
  detail.textContent = p.get('error_description') || p.get('error');
} else if (p.get('code')) {
  msg.textContent = 'Autorización recibida. Ya puedes cerrar esta ventana y volver a la aplicación.';
} else {
  msg.textContent = 'Esta página recibe la respuesta de inicio de sesión de TikTok.';
}
</script>
</body>
</html>
